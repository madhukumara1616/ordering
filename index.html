<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Food Ordering Web Application</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <!-- Google Fonts for better typography -->
  <link href="https://fonts.googleapis.com/css?family=Inter:400,500,600,700,800&display=swap" rel="stylesheet">
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3075/3075977.png">
</head>
<body>
  <header>
    <div class="logo">
      <img src="https://cdn-icons-png.flaticon.com/512/3075/3075977.png" alt="Logo" width="36" height="36" style="vertical-align:middle;">
      FoodieOrder
    </div>
    <nav>
      <a href="#menu" id="nav-menu" class="active">Menu</a>
      <a href="#cart" id="nav-cart" class="cart-badge" aria-label="View cart">
        <span class="icon">🛒</span>
        Cart
        <span class="badge" id="cart-badge" aria-live="polite">0</span>
      </a>
    </nav>
  </header>
  <main id="app">
    <!-- Content rendered by script.js -->
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
