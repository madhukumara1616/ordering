<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Food Ordering Web Application</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="container header-container">
      <h1 class="logo">Food Order</h1>
      <nav>
        <button id="nav-menu" class="nav-btn" aria-label="Menu">Menu</button>
        <button id="nav-cart" class="nav-btn" aria-label="Cart">
          Cart <span id="cart-badge" class="cart-badge" aria-label="Cart items count">0</span>
        </button>
      </nav>
    </div>
  </header>

  <main id="app" class="main-content">
    <!-- Dynamic content rendered here -->
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
